name: 🚀 Deploy website on push

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📁 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./htdocs/
          # Exclui ficheiros pesados não executáveis dos plugins
          exclude: |
            **/.git*
            **/.git*/**
            wp-content/uploads/**
            wp-content/cache/**
            **/*.map
            **/*.txt
            **/*.md
            **/node_modules/**
            **/tests/**
