name: 🚀 Deploy website on push

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obter histórico do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante acesso ao commit anterior ao push

      - name: 📦 Enviar apenas ficheiros do commit
        if: github.event.head_commit.message != 'test: deploy WordPress plugins via FTP'
        run: |
          sudo apt-get update && sudo apt-get install -y lftp

          # Identifica os ficheiros alterados, adicionados ou modificados no último commit
          BASE_SHA="${{ github.event.before }}"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA")

          echo "Ficheiros a enviar:"
          echo "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "Nenhum ficheiro para transferir."
            exit 0
          fi

          # Cria um script de comandos em lote para o lftp
          echo "set ftp:ssl-allow no" > upload_script.lftp
          echo "set net:timeout 15" >> upload_script.lftp
          echo "set net:max-retries 3" >> upload_script.lftp

          for FILE in $CHANGED_FILES; do
            # Ignora ficheiros de sistema do git, workflows e documentação
            if [[ "$FILE" != .github* && "$FILE" != .git* && -f "$FILE" ]]; then
              DIR=$(dirname "$FILE")
              # Garante que a diretoria remota existe e faz o upload
              echo "mkdir -p ./htdocs/$DIR" >> upload_script.lftp
              echo "put $FILE -o ./htdocs/$FILE" >> upload_script.lftp
            fi
          done

          echo "quit" >> upload_script.lftp

          # Executa a ligação e transferências
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" ${{ secrets.FTP_SERVER }} < upload_script.lftp

      - name: 🧪 Testar envio da pasta wp-content/plugins
        if: github.event.head_commit.message == 'test: deploy WordPress plugins via FTP'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          test -d wp-content/plugins || { echo "Pasta wp-content/plugins inexistente"; exit 1; }
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" || { echo "Secrets FTP em falta"; exit 1; }
          echo "A enviar wp-content/plugins (sem apagar ficheiros remotos)..."
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set net:timeout 20
          set net:max-retries 2
          set xfer:clobber yes
          mkdir -p ./htdocs/wp-content/plugins
          mirror --reverse --verbose --no-perms --parallel=2 wp-content/plugins ./htdocs/wp-content/plugins
          bye
          LFTP
          echo "Teste FTP concluído."
