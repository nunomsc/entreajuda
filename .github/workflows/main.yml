name: 🚀 Deploy website on push

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy incremental
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obter repositório e histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Enviar apenas ficheiros alterados
        env:
          BASE_SHA: ${{ github.event.before }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" || {
            echo "Faltam credenciais FTP nos GitHub Secrets."
            exit 1
          }

          if [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Sem commit base válido: a listar ficheiros da revisão atual."
            git ls-files -z | while IFS= read -r -d '' file; do printf 'A\\0%s\\0' "$file"; done > changed_files.bin
          else
            git diff --name-status --no-renames -z --diff-filter=ACMDT "$BASE_SHA" "$GITHUB_SHA" -- > changed_files.bin
          fi

          # Citar caminhos para o interpretador de comandos do lftp.
          quote_lftp() {
            local value="$1"
            value=${value//\\/\\\\}
            value=${value//\"/\\\"}
            printf '"%s"' "$value"
          }

          {
            echo "set cmd:fail-exit yes"
            echo "set ftp:ssl-allow no"
            echo "set net:timeout 20"
            echo "set net:max-retries 3"
            echo "set xfer:clobber yes"
          } > upload_script.lftp

          uploads=0
          deletions=0
          while IFS= read -r -d '' status && IFS= read -r -d '' file; do
            case "$file" in
              .github/*|.git/*|README*|*.md|wp-config.php) continue ;;
            esac

            case "$status" in
              D)
                # Apaga apenas ficheiros explicitamente removidos do Git.
                echo "A eliminar do FTP: $file"
                printf 'rm %s\n' "$(quote_lftp "./htdocs/$file")" >> upload_script.lftp
                deletions=$((deletions + 1))
                ;;
              A|C|M|T)
                [[ -f "$file" ]] || continue
                dir=$(dirname "$file")
                echo "A enviar: $file"
                printf 'mkdir -pf %s\n' "$(quote_lftp "./htdocs/$dir")" >> upload_script.lftp
                printf 'put %s -o %s\n' "$(quote_lftp "$file")" "$(quote_lftp "./htdocs/$file")" >> upload_script.lftp
                uploads=$((uploads + 1))
                ;;
            esac
          done < changed_files.bin

          if (( uploads + deletions == 0 )); then
            echo "Nenhum ficheiro do site alterado. Nada a enviar."
            exit 0
          fi

          echo "FTP: $uploads ficheiro(s) a enviar; $deletions ficheiro(s) a eliminar."
          echo "bye" >> upload_script.lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" < upload_script.lftp
          echo "Deploy incremental concluído."
