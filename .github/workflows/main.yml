name: 🚀 Deploy website on push

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📁 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Caminho no InfinityFree onde o site é servido
          server-dir: ./htdocs/
          # Se estiveres a sincronizar apenas um tema específico, ajusta o caminho:
          # local-dir: ./wp-content/themes/teu-tema/
          # server-dir: ./htdocs/wp-content/themes/teu-tema/
          dangerous-clean-slate: false
